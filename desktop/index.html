<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9f9f9" />
    <title>Silan Viking</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; background: #f9f9f9; }
      #boot-primer {
        position: fixed;
        inset: 0;
        z-index: 110;
        overflow: hidden;
        background: #f9f9f9;
        opacity: 1;
        transition: opacity 420ms ease-out, transform 520ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #boot-primer.is-handoff {
        pointer-events: none;
        opacity: 0;
        transform: scale(1.012);
      }
      .boot-primer-character {
        position: absolute;
        top: 50%;
        left: 50%;
        width: clamp(240px, 30vw, 400px);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        animation: boot-character-arrive 800ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .boot-primer-orb {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .boot-primer-breath,
      .boot-primer-gaze,
      .boot-primer-eye-blink,
      .boot-primer-eye {
        transform-box: fill-box;
        transform-origin: center;
      }
      .boot-primer-breath {
        animation: boot-primer-breathe 3.2s ease-in-out infinite;
      }
      .boot-primer-gaze {
        animation: boot-primer-gaze 5.6s cubic-bezier(0.45, 0, 0.2, 1) infinite;
      }
      .boot-primer-eye-blink {
        animation: boot-primer-blink 5.6s linear infinite;
      }
      .boot-primer-eye-left {
        animation: boot-primer-left-curiosity 5.6s ease-in-out infinite;
      }
      .boot-primer-eye-right {
        animation: boot-primer-right-curiosity 5.6s ease-in-out infinite;
      }
      .boot-primer-copy {
        position: fixed;
        top: calc(50% + clamp(142px, 15vw, 182px));
        left: 50%;
        width: min(340px, 92vw);
        height: 18px;
        margin: 0;
        color: #6e7382;
        font: 520 10px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.035em;
        transform: translateX(-50%);
        white-space: nowrap;
      }
      .boot-primer-copy span {
        position: absolute;
        inset: 0;
        opacity: 0;
        text-align: center;
        transform: translateY(4px);
        animation: boot-copy-cycle 4.8s ease-in-out infinite both;
      }
      .boot-primer-copy span:nth-child(2) { animation-delay: 1.2s; }
      .boot-primer-copy span:nth-child(3) { animation-delay: 2.4s; }
      .boot-primer-copy span:nth-child(4) { animation-delay: 3.6s; }
      @keyframes boot-primer-breathe {
        0%, 100% { transform: translateY(0) rotate(-0.5deg) scale(1, 1); }
        38% { transform: translateY(-2px) rotate(0.6deg) scale(1.012, 0.992); }
        68% { transform: translateY(1px) rotate(0deg) scale(0.996, 1.008); }
      }
      @keyframes boot-primer-gaze {
        0%, 12%, 100% { transform: translate(0, 0) rotate(-8deg); }
        22%, 34% { transform: translate(13px, -8px) rotate(-13deg); }
        45%, 55% { transform: translate(-10px, -2px) rotate(5deg); }
        66%, 76% { transform: translate(6px, 10px) rotate(-2deg); }
        87%, 93% { transform: translate(-3px, 4px) rotate(-9deg); }
      }
      @keyframes boot-primer-blink {
        0%, 18%, 21%, 48%, 51%, 82%, 85%, 100% { transform: scaleY(1); }
        19.4%, 49.4%, 83.4% { transform: scaleY(0.06); }
      }
      @keyframes boot-primer-left-curiosity {
        0%, 12%, 100% { transform: scale(1, 1); }
        22%, 34% { transform: scale(1.13, 0.88); }
        45%, 55% { transform: scale(0.86, 1.08); }
        66%, 76% { transform: scale(1.04, 0.78); }
        87%, 93% { transform: scale(0.94, 1.12); }
      }
      @keyframes boot-primer-right-curiosity {
        0%, 12%, 100% { transform: scale(1, 1); }
        22%, 34% { transform: scale(0.84, 1.08); }
        45%, 55% { transform: scale(1.12, 0.82); }
        66%, 76% { transform: scale(0.9, 1.14); }
        87%, 93% { transform: scale(1.08, 0.84); }
      }
      @keyframes boot-character-arrive {
        from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
        to { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
      }
      @keyframes boot-copy-cycle {
        0%, 25%, 100% { opacity: 0; transform: translateY(4px); }
        4%, 20% { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-primer,
        #boot-primer * { animation: none !important; transition-duration: 1ms !important; }
        .boot-primer-copy span:first-child { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-primer" role="status" aria-label="Silan Viking is preparing the workspace">
      <div class="boot-primer-character" aria-hidden="true">
        <svg class="boot-primer-orb" viewBox="-150 -150 300 300">
          <g class="boot-primer-breath">
            <circle cx="0" cy="0" r="100" fill="#0a0a0c" />
            <g class="boot-primer-gaze" fill="#f9f9f9">
              <g class="boot-primer-eye-blink">
                <rect class="boot-primer-eye boot-primer-eye-left" x="-43" y="-23" width="24" height="46" rx="12" />
              </g>
              <g class="boot-primer-eye-blink">
                <rect class="boot-primer-eye boot-primer-eye-right" x="18" y="-19" width="20" height="38" rx="10" />
              </g>
            </g>
          </g>
        </svg>
      </div>
      <p class="boot-primer-copy" aria-hidden="true">
        <span>Reading the local source</span>
        <span>Reconnecting notes and evidence</span>
        <span>Restoring review boundaries</span>
        <span>Preparing the workspace</span>
      </p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
