# deploy/proxy.conf — the `proxy` service: public entry, routes /api to the
# backend and everything else to the web service. TLS is intentionally left
# to the deployment host (a real cert via certbot, or a managed LB); this
# config is the HTTP-level routing the e2e Docker stack needs.
server {
    listen 80;
    server_name _;

    # API requests go to the Go backend. The /api prefix is stripped because
    # the backend registers routes at /api/v1/... already — keep the prefix.
    location /api/ {
        client_max_body_size 128m;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        # The backend router owns CORS, including preflight and error responses.
        proxy_pass http://backend:5200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/analytics/crawler-hit {
        return 404;
    }

    # Everything else is the static site.
    location / {
        mirror /_silan_crawler_hit;
        mirror_request_body off;
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static crawler requests do not execute JavaScript and never reach the
    # API middleware. Mirror their request metadata into the same analytics
    # state machine; the backend discards non-crawler traffic.
    location = /_silan_crawler_hit {
        internal;
        proxy_pass http://backend:5200/api/v1/analytics/crawler-hit;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Silan-Request-ID $request_id;
        proxy_set_header X-Silan-Original-Method $request_method;
        proxy_set_header X-Silan-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Referer $http_referer;
    }
}
